name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The gitleaks CLI is used directly (instead of gitleaks-action) because the
      # action requires a paid license for organization-owned repositories.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks dir . --redact --verbose

      - name: Scan new commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            echo "No base commit available; working-tree scan above covers this push."
            exit 0
          fi
          gitleaks git . --log-opts="$range" --redact --verbose

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check page documentation
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      # Runs the unit tests with coverage; fails when the global thresholds
      # in angular.json (test.options.coverageThresholds) are not met.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      # Production build without set-version (CI must not rewrite version files).
      - name: Build
        run: npx ng build --configuration production
