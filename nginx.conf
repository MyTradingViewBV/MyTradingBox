# Served as /etc/nginx/conf.d/default.conf by the official nginx image, which
# includes conf.d/*.conf inside the http{} block. Top-level directives in this
# file are therefore in http context.
#
# The SPA calls its API directly at https://mytradingbox.com/ (environment.prod.ts
# apiUrl), so no /api/ proxy is configured here.

limit_req_zone $binary_remote_addr zone=spa_req:10m rate=10r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # --- Security headers ---
  # add_header is NOT inherited into a location that declares its own add_header,
  # so locations below that add Cache-Control repeat the security headers.
  # script-src hash: Angular's critical-CSS inlining emits onload="this.media='all'"
  # on the stylesheet <link>; 'unsafe-hashes' + its sha256 allows only that handler.
  set $csp "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://mytradingbox.com https://api.coingecko.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net wss://stream.binance.com:9443 wss://fstream.binance.com wss://stream.bybit.com wss://ws.bitvavo.com wss://futures.kraken.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

  add_header Content-Security-Policy $csp always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

  # --- Never cache the app shell / service worker manifests ---
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }

  location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|custom-sw\.js)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /manifest.json {
    default_type application/manifest+json;
    types { }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # --- Hashed build output (outputHashing: all), e.g. main-JNC2WS6A.js,
  # styles-LGUZUIF6.css, chunk-C-j5Ubpi.js (8-char hash may contain - and _) ---
  location ~ "^/[a-z]+-[A-Za-z0-9_-]{8}\.(js|mjs|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Hashed media emitted by the Angular build.
  location /media/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # --- SPA fallback with rate limiting ---
  location / {
    limit_req zone=spa_req burst=20 nodelay;
    try_files $uri $uri/ /index.html;
  }
}
