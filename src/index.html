<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!--
    Content-Security-Policy (meta form: GitHub Pages cannot send response headers).
    - script-src hash = the inline media-swap script Angular/Beasties appends to the prod
      index.html for the deferred global stylesheet. Re-hash it if an Angular upgrade changes it.
    - style-src 'unsafe-inline': Angular component styles, Beasties critical CSS, chart libs.
    - connect-src: API (prod + dev), CoinGecko, exchange WebSocket streams.
    - img-src: data: coin icons from the API + jsDelivr cryptocurrency-icons fallback.
    - frame-ancestors / report-uri / sandbox are ignored in meta CSP; set them at the edge if ever possible.
    - Requires AOT: the JIT compiler (aot:false) needs 'unsafe-eval', which is deliberately not allowed.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://mytradingbox.com https://localhost:7212 https://api.coingecko.com wss://stream.binance.com:9443 wss://fstream.binance.com wss://stream.bybit.com wss://ws.bitvavo.com wss://futures.kraken.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>MyTradingBox</title>

  <!-- Base href - production uses /MyTradingBox/ for GitHub Pages -->
  <base href="/" />

  <!-- Fonts / Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Capacitor viewport configuration for iOS safe area -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="MyTradingBox - Professional trading application" />

  <!-- iOS PWA support -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TradingBox" />
  <meta name="format-detection" content="telephone=no" />

  <!-- iOS required icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180x180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167x167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152x152.png" />


</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to run this app.</noscript>
</body>

</html>
