<div class="app-container">
    <!-- Solid fixed strip under the status bar: iOS 26 home-screen apps blur the top edge unless a fixed element with an opaque background touches it. -->
    <div class="status-bar-strip" aria-hidden="true"></div>
    <main class="app-content">
        <router-outlet></router-outlet>
        @if(showOnboarding) {
            <app-onboarding (completed)="onOnboardingCompleted()"></app-onboarding>
        }
    </main>
    <app-toast></app-toast>
</div>
