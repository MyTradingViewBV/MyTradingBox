<ng-template #content>
  <span class="status-item" [title]="'CHART.STATUS_API_' + apiStatus() | translate">
    <span class="dot" [class]="apiStatus()"></span>API
  </span>
  @if (isAdmin()) {
    <span class="status-item" [title]="'CHART.STATUS_BOTS_' + botsStatus() | translate">
      <span class="dot" [class]="botsStatus()"></span>Bots
      @if (offlineBots().length) {
        <span class="count">{{ offlineBots().length }}</span>
      }
    </span>
  }
</ng-template>

<!-- Only admins can open the heartbeat overview, so for everyone else the pill is not clickable. -->
@if (isAdmin()) {
  <button type="button" class="status-pill clickable" (click)="openHeartbeats()"
    (mousedown)="$event.stopPropagation()" (touchstart)="$event.stopPropagation()"
    [attr.aria-label]="'CHART.STATUS_OPEN_HEARTBEATS' | translate">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </button>
} @else {
  <span class="status-pill" [attr.aria-label]="'CHART.SYSTEM_STATUS' | translate">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </span>
}
