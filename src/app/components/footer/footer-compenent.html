<footer class="app-footer">
  <button type="button" class="footer-btn" (click)="navigate('chart')">
    <span class="icon">📊</span>
    <span class="label">{{ 'FOOTER.CHART' | translate }}</span>
  </button>

  <button type="button" class="footer-btn" (click)="navigate('orders')">
    <span class="icon">💼</span>
    <span class="label">{{ 'FOOTER.ORDERS' | translate }}</span>
  </button>

  @if (isAdmin()) {
    <button type="button" class="footer-btn" (click)="navigate('watchlist')">
      <span class="icon">👁️</span>
      <span class="label">{{ 'FOOTER.WATCHLIST' | translate }}</span>
    </button>
  }

  <button type="button" class="footer-btn" (click)="navigate('balance')">
    <span class="icon">💰</span>
    <span class="label">{{ 'FOOTER.BALANCE' | translate }}</span>
  </button>

  @if (isWeb() && isAdmin()) {
    <button type="button" class="footer-btn footer-btn-web" (click)="toggleWebOptions()">
      <span class="icon">🖥️</span>
      <span class="label">{{ 'FOOTER.WEB' | translate }}</span>
    </button>
  }

  <button type="button" class="footer-btn" (click)="navigate('dashboard')">
    <span class="icon">⚙️</span>
    <span class="label">{{ 'FOOTER.SETTINGS' | translate }}</span>
  </button>
</footer>

@if (showWebOptions) {
  <button type="button" class="web-options-backdrop" (click)="closeWebOptions()" aria-label="Close web options"></button>
  <div class="web-options-sheet" role="dialog" aria-modal="true" aria-label="Web options">
    <button type="button" class="web-option-btn" (click)="openWebOption('web-chart')">
      {{ 'FOOTER.WEB_CHART' | translate }}
    </button>
    <button type="button" class="web-option-btn" (click)="openWebOption('market-cipher-b-chart')">
      {{ 'FOOTER.MARKET_CIPHER_B_CHART' | translate }}
    </button>
    <button type="button" class="web-option-btn" (click)="openWebOption('simple-chart')">
      {{ 'FOOTER.SIMPLE_CHART' | translate }}
    </button>
  </div>
}
